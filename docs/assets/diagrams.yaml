# The architecture diagrams on Learn › Architecture, as data. Regenerate after any change:
#   medomni studio diagrams docs/assets/diagrams.yaml --out docs/assets/
# Boxes: kind internal (filled), person, system, external (white), data (tint). Positions in pixels.
# Arrow ends: from_side / to_side as top | bottom | left | right, or [side, fraction]; default: facing sides.

parts:
  system: {colour: "#002060"}
  core: {colour: "#212121"}
  bench: {colour: "#1E8090"}
  perception: {colour: "#C55A11"}
  studio: {colour: "#7030A0"}
  ext: {colour: "#424242"}

diagrams:
  c1-context:
    title: C1 context
    width: 1100
    height: 560
    key: [[MedOmni, system], [External system, external]]
    boxes:
      - {id: evaluator, kind: person, part: system, x: 130, y: 20, w: 240, h: 84, title: Agent evaluator, tag: Person, desc: [builds task sets · runs agents]}
      - {id: encuser, kind: person, part: system, x: 430, y: 20, w: 240, h: 84, title: Encoder user, tag: Person, desc: [calls encoders]}
      - {id: contributor, kind: person, part: system, x: 730, y: 20, w: 240, h: 84, title: Contributor, tag: Person, desc: [datasets · tasks · encoders · reviews]}
      - {id: medomni, kind: system, part: system, x: 60, y: 200, w: 980, h: 90, title: MedOmni, tag: Software System, desc: [Core · Bench · Perception · Studio, "one package, one command: medomni"]}
      - {id: datasets, kind: external, part: bench, x: 20, y: 400, w: 160, h: 80, title: Datasets, tag: External System, desc: [your licensed copy · VitalDB]}
      - {id: harbor, kind: external, part: bench, x: 200, y: 400, w: 160, h: 80, title: Harbor, tag: External System, desc: [Docker · atom tasks]}
      - {id: provider, kind: external, part: bench, x: 380, y: 400, w: 160, h: 80, title: Model provider, tag: External System, desc: [LLM API]}
      - {id: registry, kind: external, part: perception, x: 560, y: 400, w: 160, h: 80, title: Container registry, tag: External System, desc: [ghcr.io/medomni]}
      - {id: hf, kind: external, part: perception, x: 740, y: 400, w: 160, h: 80, title: Hugging Face, tag: External System, desc: [model cards · samples]}
      - {id: plugins, kind: external, part: core, x: 920, y: 400, w: 160, h: 80, title: Plug-in packages, tag: External System, desc: [medomni-*]}
    edges:
      - {from: evaluator, to: medomni, to_side: [top, 0.194], label: "builds, runs, scores", tech: medomni bench}
      - {from: encuser, to: medomni, to_side: [top, 0.5], label: calls encoders, tech: HTTP/JSON}
      - {from: contributor, to: medomni, to_side: [top, 0.806], label: "adds, proposes, reviews", tech: "pull request, medomni studio"}
