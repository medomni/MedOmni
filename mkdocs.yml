site_name: MedOmni
site_description: A benchmark for medical multimodal agents
site_url: https://medomni.ai/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

extra:
  version:
    provider: mike

exclude_docs: |
  assets/diagrams.yaml

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - def_list
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started: get-started.md
  - Learn:
      - Design principles: learn/principles.md
      - Concepts: learn/concepts.md
      - Architecture: learn/architecture.md
      - Core:
          - Contracts: learn/core/contracts.md
          - Families: learn/core/families.md
          - Cache: learn/core/cache.md
          - Plug-ins: learn/core/plugins.md
      - Bench:
          - Datasets: learn/bench/datasets.md
          - Tasks: learn/bench/tasks.md
          - Build: learn/bench/build.md
          - Recipes: learn/bench/recipes.md
          - Runs: learn/bench/runs.md
          - Scoring: learn/bench/scoring.md
      - Perception:
          - Encoders: learn/perception/encoders.md
          - Gateway: learn/perception/gateway.md
      - Studio:
          - Overview: learn/studio/overview.md
          - Audit: learn/studio/audit.md
      - Extend MedOmni: learn/extend.md
  - Guides:
      - Run your agent: guides/run-your-agent.md
      - Connect your data: guides/connect-your-data.md
      - Rebuild a task set: guides/rebuild-a-task-set.md
      - Use the encoders: guides/use-the-encoders.md
      - Contribute: guides/contribute.md
  - Reference:
      - Tasks: reference/tasks.md
      - Recipes: reference/recipes.md
      - Encoders: reference/encoders.md
      - Families: reference/families.md
      - Datasets: reference/datasets.md
      - Gateway API: reference/gateway-api.md
      - Audit: reference/audit.md
  - Commands: cli/index.md
  - Python API: api/index.md
  - Migration (temporary): migration.md
