# What THIS machine does. Environment config, never task content — the way
# data_task/tasks/data_roots.yaml records data roots.
#
# Nothing here reaches an agent. The Service API is encode(file, encoder_id),
# and an agent that could ask for resources would produce Evidence another
# agent cannot reproduce.

# Host directory mounted read-only at /data in every container. Every request
# path is relative to it. Leave null and containers read their own baked
# testdata, which is enough to try the gateway out.
#
# A file under it must not change while a request is reading it: the gateway
# digests the input, then the container opens it, and Evidence would otherwise
# pair the digest of one version with the outputs of another.
data_root: null

# The pool. A sixth encoder evicts the least recently used of five.
max_live_containers: 5
idle_timeout_s: 900        # stop a container idle this long. 0 disables the reaper
reap_interval_s: 30
start_timeout_s: 180       # ecgfounder reads 353 MiB of weights before it answers
acquire_timeout_s: 300     # how long a request waits for a free slot

# Simultaneous calls one container accepts. The gateway holds the limit, so a
# container never has to defend itself.
default_concurrency: 4

# Which images to run. registry.py builds :dev; a published tag goes here once
# GHCR exists (README phase 5). The image a container actually ran is recorded
# in Evidence and is part of the fingerprint, so a rebuild invalidates the cache.
image_tag: dev

# Where a container publishes its port. Loopback: an encoder is not a public
# service, and it authenticates nobody.
bind_host: 127.0.0.1

cache_bytes: 268435456     # Evidence kept, keyed by fingerprint. 0 disables
call_log: var/calls.jsonl  # relative to this file. null disables
log_paths: true            # false records a digest instead — a path can name a patient
stop_on_exit: true
container_prefix: medomni-gw

# The operator routes under /admin: pool status, warm, stop. They are kept out
# of the OpenAPI schema either way — /docs is how an agent learns what it may
# call, and the pool is not its business. false removes them entirely.
admin_api: true

encoders:
  ecg-12lead-500hz-mv__ecgfounder:
    concurrency: 1
  cxr-radiograph-2d__torchxrayvision:
    concurrency: 2
