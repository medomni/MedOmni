id: cxr-radiograph-2d__biomedclip
family: cxr-radiograph-2d
modality: cxr
summary: Normalized biomedical image embeddings and cosine similarity to fixed normal
  and pneumonia prompts.
outputs:
- kind: embedding
  dim: 512
- kind: labels
  scale: score
  labels:
  - normal_prompt_similarity
  - pneumonia_prompt_similarity
limits:
- 'Uses fixed prompts: a normal chest X-ray; a chest X-ray with pneumonia.'
- Cosine similarities are not probabilities. The 512-dimensional image embedding is
  unit-normalized.
- Uses the upstream 224-pixel image transform and a locally packaged tokenizer.
- General biomedical training does not establish chest-disease diagnostic reliability.
reliability:
  status: unmeasured
non_training: true
