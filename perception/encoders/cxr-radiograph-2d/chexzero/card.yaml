id: cxr-radiograph-2d__chexzero
family: cxr-radiograph-2d
modality: cxr
summary: Chest finding scores from one pinned CheXzero checkpoint and positive/negative
  text prompts.
outputs:
- kind: labels
  scale: score
  labels:
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Enlarged Cardiomediastinum
  - Fracture
  - Lung Lesion
  - Lung Opacity
  - No Finding
  - Pleural Effusion
  - Pleural Other
  - Pneumonia
  - Pneumothorax
  - Support Devices
limits:
- Uses checkpoint best_64_5e-05_original_22000_0.864.pt, not the ten-checkpoint ensemble.
- Images are aspect-preserving resized and padded to 320 pixels, normalized, then
  resized to the checkpoint resolution.
- Scores use upstream positive/negative cosine-similarity softmax without logit scaling;
  they are not calibrated clinical probabilities.
- Test images are pediatric; diagnostic reliability is unmeasured.
reliability:
  status: unmeasured
non_training: true
