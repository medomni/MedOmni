id: ecg-12lead-500hz-mv__ecgfounder
family: ecg-12lead-500hz-mv
modality: ecg
summary: A hundred and fifty diagnostic-statement probabilities and a pooled embedding, from a twelve-lead ECG model pretrained
  on ten million recordings.
authors:
- {name: Timo Stoffregen}
- {name: Bosong Huang}
intended_use: Diagnostic screening on a ten-second twelve-lead resting ECG at 500 Hz, in mV, with leads aligned by name. One
  probability per statement, independent of the others, and one embedding for an agent that can use a vector.
limits: [Needs all twelve leads. A reduced lead set is a different family and a different encoder., 'Lead order is taken from
    the family protocol. Alignment is by name, never by position.', 'Ten seconds are encoded, from the start of the record.
    A longer record is truncated, and the rest is never seen.', 'The labels are the diagnostic statements of the reporting
    system the model was pretrained on, not a curated ontology. Some qualify another statement instead of standing alone,
    such as WITH RAPID VENTRICULAR RESPONSE and R IN AVL.', 'Each probability comes from its own sigmoid, so they neither
    sum to one nor rank against each other. Compare them within one recording, not between patients.', 'Pretraining is the
    Harvard-Emory ECG Database. MIMIC-ECG is not part of it, so a task that scores on MIMIC does not overlap with the pretraining
    of this encoder.', 'The embedding is a representation, not a finding. An agent that cannot use a vector must read the
    labels.']
outputs:
- kind: labels
  scale: probability
  labels: [ABNORMAL ECG, NORMAL SINUS RHYTHM, NORMAL ECG, SINUS RHYTHM, SINUS BRADYCARDIA, ATRIAL FIBRILLATION, SINUS TACHYCARDIA,
