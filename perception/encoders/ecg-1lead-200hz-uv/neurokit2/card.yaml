id: ecg-1lead-200hz-uv__neurokit2
family: ecg-1lead-200hz-uv
modality: ecg
summary: R-peaks, heart rate, template quality and time-domain heart-rate variability from single-lead ECG.
authors:
- {name: Timo Stoffregen}
