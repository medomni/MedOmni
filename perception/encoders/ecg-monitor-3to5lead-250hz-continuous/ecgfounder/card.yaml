id: ecg-monitor-3to5lead-250hz-continuous__ecgfounder
family: ecg-monitor-3to5lead-250hz-continuous
modality: ecg
summary: ECGFounder diagnostic-statement probabilities and a pooled embedding from one ECG lead.
intended_use: Ten-second continuous monitor ECG segments with a named lead II.
limits:
- Uses lead II and ignores the other monitor leads.
- Resamples the first ten seconds to the checkpoint training rate of 500 Hz.
- The 150 labels are reporting-system statements and are not a curated ontology.
- The embedding is a representation, not a finding.
