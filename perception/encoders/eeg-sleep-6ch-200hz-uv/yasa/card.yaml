id: eeg-sleep-6ch-200hz-uv__yasa
family: eeg-sleep-6ch-200hz-uv
modality: eeg
summary: Thirty-second sleep stages from the C3-M2 EEG channel using the pretrained YASA classifier.
authors:
- {name: Timo Stoffregen}
- {name: Bosong Huang}
intended_use: Whole-night sleep EEG carrying a C3-M2 channel, in adults. Not intended for fragmentary recordings or for paediatric
  montages.
outputs:
- kind: events
  labels: [Wake, N1, N2, N3, REM]
limits: [The six declared channels must be available at 200 Hz in microvolts. Only C3-M2 is staged., 'Reads continuous EDF,
    including separate mastoid electrodes or explicit A1/A2 references. HDF5 is not supported.', Requires at least five minutes.
    Whole-night recordings are preferred; short windows give limited context., 'No EOG, EMG, age, or sex is supplied to this
    EEG-only classifier.', Incomplete trailing epochs are discarded and reported. These stages are not a diagnosis.]
reliability: {status: unmeasured}
non_training: true
