id: eog-2ch-200hz-uv__wav2sleep-eog
family: eog-2ch-200hz-uv
modality: eog
summary: Five-class sleep stages from two electro-oculography channels.
intended_use: Sleep staging of complete 30-second epochs in two-channel EOG recordings.
outputs:
- kind: events
  labels: [Wake, N1, N2, N3, REM]
options:
  max_epochs: Maximum number of 30-second epochs to score. The default and maximum are 1200.
limits:
- Uses the published two-channel EOG checkpoint and its five-class vocabulary.
- Applies the upstream non-causal whole-recording normalization, so output can change when the recording boundary changes.
- Requires at least two complete epochs and ignores a final partial epoch.
reliability: {status: unmeasured}
non_training: true
