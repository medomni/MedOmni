id: fundus-photography-2d__retfound
family: fundus-photography-2d
modality: fundus
summary: A 1024-value RETFound MAE representation of a colour fundus photograph.
outputs:
- kind: embedding
  dim: 1024
limits:
- Only single-frame, eight-bit RGB DICOM images are accepted. Infrared and grayscale images are rejected.
- Uses the pretrained MAE encoder class token, with no disease classification head.
- Images are resized to a 256-pixel short edge, centre-cropped to 224 pixels, and normalized with ImageNet
  statistics.
- The official weights require Hugging Face approval and are licensed for noncommercial use.
- Embeddings are not diagnoses or calibrated clinical scores.
reliability:
  status: unmeasured
non_training: true
