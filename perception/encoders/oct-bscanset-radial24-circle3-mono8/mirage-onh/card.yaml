id: oct-bscanset-radial24-circle3-mono8__mirage-onh
family: oct-bscanset-radial24-circle3-mono8
modality: oct
summary: A 768-value representation of the optic-nerve-head radial fan, from a retinal foundation model pretrained on paired
  OCT and SLO images, with a count of the circle scans it declined to embed.
authors:
- {name: Xianglong Bao}
- {name: Bosong Huang}
intended_use: 'Evidence for an agent that can use a vector: one embedding over the 24 radial B-scans through the disc. The
  circle scans are a different geometry and are reported, not averaged in. The embedding carries no findings.'
limits: ['Returns a representation, not a finding. There is no classification head in the released checkpoint, and none was
    added.', 'Only the 24 radial scans are embedded. The 3 circle scans cut the peripapillary nerve fibre layer rather than
    the disc, and averaging two geometries would give one vector standing for neither; their count is reported instead.',
  'Each radial B-scan is encoded on its own and the embeddings are averaged; the count is reported. Averaging is this adapter''s
    choice, not the paper''s — a radial fan is not a sequence to this model, and the fan has no canonical order.', Blank radial
    scans are excluded from the average and reported. A set whose radial scans are all blank degrades., 'A file that does
    not hold exactly 24 radial and 3 circle frames degrades: that composition is what the family declares, and a partial set
    is not a smaller one.', 'MIRAGE''s pretraining is dominated by macular OCT. Optic-nerve-head radial scans are a different
    anatomy, and nothing here measures how far outside the training distribution they fall.', 'Every B-scan is resized to
    512 square and scaled to 0..1, as the published wrapper expects. Aspect ratio is not preserved, and the axial and lateral
    axes are not scaled alike.', 'MIRAGE was pretrained on OCT paired with SLO; this family supplies no SLO, so only the B-scan
    modality is given. The result is the OCT half of a model trained to see both.', 'Frame geometry is read from each frame''s
    own reference coordinates, never from its position in the file.', 'A file that records no per-frame reference coordinates
    degrades: the family allows it, but without geometry a radial line cannot be told from a circle, and embedding all 27
    frames would give one vector standing for two geometries.', 'Embeddings are comparable within one encoder version and
    one image. They are not comparable with any other encoder''s, and their distances have no clinical calibration.', 'License
    conflict, unresolved: the upstream README claims CC BY 4.0 and permits commercial use, while the repository''s own LICENSE
    file and the Hugging Face model card both say CC BY-NC-ND 4.0. This card records the stricter pair, which is what the
    authors shipped. Publishing this image needs a licence review first, as the Zhu card does for a different reason.']
outputs:
- kind: labels
  scale: physical
  labels: [n_radial_embedded, n_circle_excluded]
- {kind: embedding, dim: 768}
reliability: {status: unmeasured}
non_training: true
license: CC-BY-NC-ND-4.0
