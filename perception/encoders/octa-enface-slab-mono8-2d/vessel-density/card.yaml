id: octa-enface-slab-mono8-2d__vessel-density
family: octa-enface-slab-mono8-2d
modality: octa
summary: 'SEMANTIC: foveal avascular zone area (mm2) and parafoveal vessel density of a macular superficial OCTA slab, with
  z-scores where a published device norm exists. Rules; no model.'
authors:
- {name: Bosong Huang}
intended_use: 'Read FAZ area and density directly: an enlarged FAZ or low parafoveal density suggests capillary dropout (e.g.
  diabetic retinopathy). The text line states each value against its reference.'
limits: [Macular slabs only (fovea structure or macular protocol). An optic-disc slab returns a text line saying so and no
    measurement; an unidentified slab degrades., 'The slab is taken as superficial only when the file says so (ImageComments,
    Topcon); other slabs are measured without a reference.', 'FAZ: dark connected region around the darkest point within 1.5
    mm of the scan centre, on the slab smoothed at 30 um, cut midway between FAZ interior and capillary bed. Poor-signal slabs
    whose dark region exceeds 1.5 mm2 or reaches the edge degrade.', 'Vessel density: Otsu threshold on the slab smoothed
    at 10 um, share of vessel pixels in the 1-3 mm parafovea centred on the FAZ. Device software uses other binarisations,
    so density is comparable within this encoder, not with device reports.', 'FAZ area is compared with the Topcon Triton
    superficial-plexus norm (Shiihara 2018, manual tracing), for Topcon slabs only; vessel density has no comparable published
    reference. No axial-length correction. z-scores are unreviewed (no clinical review).']
outputs:
- kind: labels
  scale: physical
  labels: [faz_area_mm2, parafovea_vessel_density, fovea_offset_mm]
- kind: labels
  scale: score
  labels: [faz_area_z, parafovea_vessel_density_z]
- {kind: text}
reliability: {status: unmeasured}
non_training: true
license: Apache-2.0
source: {url: 'https://github.com/BosonHwang/MedOmni', rev: null}
runtime: {image: ghcr.io/medomni/octa-enface-slab-mono8-2d__vessel-density, digest: null}
acceptance: pending
