# Old paths in main's history -> their path today, so the export keeps the history of moved files (s4 part 6).
# Built from git's rename detection over main, followed back through every rename, then reviewed by hand:
# - a mapping is a move, never a copy: no commit holds the old path beside its new one (v0.2's data_task/, harness/
#   and perception/ code was copied into v0.3, and those deleted v0.2 paths stay out of the history, R-166);
# - same-name matches were all rejected: they paired different encoders that share a name (rule-amplitude, wav2sleep);
# - renames between empty files, or that change the file type, were rejected.
# A path neither in today's release tree nor here is dropped from every version.
