description: {unit: patient, time: datetime, version: "1"}
units: {table: psg_metadata, column: BDSPPatientID}
source: {salt: dummy-bdsp, fraction: 1.0}
read:
- reader: csv
  options:
    tables:
      psg_metadata:
        file: psg-metadata.csv
        subject: BDSPPatientID
        subject_type: int
        time: StudyDateTime
        visit: SessionID
        events:
        - code: SLEEP_STUDY
        - {code: AGE, value: AgeAtVisit}
        - {code: AHI, value: ahi}
- reader: tree
  options:
    files:
      psg-night:
        pattern: "psg/{subject}/{record}.h5"
        format: h5
        families: [eeg-sleep-6ch-200hz-uv, eog-2ch-200hz-uv, emg-chin-200hz-uv, emg-limb-200hz-uv, ecg-1lead-200hz-uv,
                   psg-cardiorespiratory-4ch-200hz-mixed, resp-effort-rip-2ch-50hz, spo2-series-10hz-pct,
                   pulse-rate-10hz-bpm, body-position-code-10hz]
