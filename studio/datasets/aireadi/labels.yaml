# The label library (Recipes reference page). From S1's p17_labels.yaml, all 65 targets equal to v0.2's (U1.17).
aireadi-dmstatus:
  cases:
  - then: 2
    when:
      op: ==
      pick: last
      value: OMOP//mhterm_dm2
      x: 1
  - then: 1
    when:
      op: ==
      pick: last
      value: OMOP//mhterm_predm
      x: 1
  else: 0
  from: any
  guard:
    codes:
    - ^(OMOP|CONDITION|PROCEDURE)//mhterm_dm1$
    - ^(OMOP|CONDITION|PROCEDURE)//mhterm_dm2$
    - ^(OMOP|CONDITION|PROCEDURE)//mhterm_predm$
  question: 'Your prediction is the diabetes status CLASS: 0 healthy · 1 pre-diabetes · 2 type-2 diabetes; submission column
    is the class number. Higher values MUST mean more likely positive/higher class — do not invert.'
  to: any
omopbin:mhoccur_ca:
  from: any
  guard:
    codes:
    - ^(OMOP|CONDITION|PROCEDURE)//mhoccur_ca$
  op: ==
  pick: last
  question: Your prediction is the probability that `mhoccur_ca` is YES (recorded value 1) for the participant. Higher values
    MUST mean more likely positive/higher class — do not invert.
  to: any
  value: OMOP//mhoccur_ca
  x: 1
