bdsp_race:           # BDSP EHR demographics `race` -> black | white | asian | other | unknown
  labels:
    "African American  or Black": black     # double space as stored in the source
    "Caucasian or White": white
    "Asian": asian
    "American Indian or Alaskan Native": other
    "Multiple": other
    "Native Hawaiian or Other Pacific Islander": other
    "Unknown, Unavailable or Unreported": unknown
    "Patient Declines": unknown
    "": unknown
  patterns: []
