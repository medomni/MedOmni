# label_vocab.yaml — every raw free-text label a derivation reads, classified explicitly (T1-labelvocab).
# A label is `counted` into a named bucket or `ignored`; an unclassified label fails the build, it is never
# silently dropped. Derivations look labels up here instead of substring matching (the "limb"/"plm"
# matcher missed BDSP's dominant `LM` label and made frequent_limb_movements constant).
# Exact labels first, then `patterns` (regex, full match). Reviewed by assurance. Task session, 2026-09-24.

psg_stages:          # BDSP *_scores.csv, column Sleep_Stage -> w | n1 | n2 | n3 | r | ignored
  labels:
    W: w
    N1: n1
    N2: n2
    N3: n3
    R: r
    "": ignored   # unscored epoch (1,210): the pre-F2 code skipped it too
  patterns: []

psg_events:          # BDSP *_events.csv, column Event -> resp | arousal | limb | ignored
  # Generated 2026-09-24 from the full vocabulary (psg_label_hist.jsonl: 1,400 nights, 86 word labels).
  # resp / arousal reproduce the pre-F2 matcher EXACTLY (regression-identical gold); the only change is
  # limb: `LM` counts. REVIEW POINTS for assurance / Bosong:
  #  - `Apnea Arousal` and `Hypopnea Arousal` are arousals, but the old matcher counted them as resp
  #    (it tested apnea/hypopnea first); kept as resp here — correcting them changes ruled gold (see report).
  #  - `PLM` (~2.5 per night: a series marker, its movements are already `LM` rows) and `Resp Related LM`
  #    (respiratory-related, excluded from periodic-limb scoring by convention) are ignored for limb.
