# The label library (Recipes reference page). From S1's p17_labels.yaml, all 65 targets equal to v0.2's (U1.17).
derived:acute-renal-failure:
  exists: ^DIAGNOSIS//ICD//(N17|584)
  from: any
  guard:
    codes:
    - ^DIAGNOSIS//ICD//(584|N17)
  question: Your prediction is the probability that the patient's record carries a coded diagnosis of acute renal failure
    (any ICD-9/10 code starting with N17 / 584). Higher values MUST mean more likely positive/higher class — do not invert.
  to: any
derived:cerebral-infarction:
  exists: ^DIAGNOSIS//ICD//(I63|433|434)
  from: any
  guard:
    codes:
    - ^DIAGNOSIS//ICD//(433|434|I63)
  question: Your prediction is the probability that the patient's record carries a coded diagnosis of cerebral infarction
    (any ICD-9/10 code starting with I63 / 433 / 434). Higher values MUST mean more likely positive/higher class — do not
    invert.
  to: any
derived:ckd-kdigo:
  from: any
  guard:
    codes:
    - LAB//50841
    - LAB//50851
    - LAB//50912
    - LAB//50920
    - LAB//51006
    - LAB//51021
    - LAB//51032
    - LAB//51045
    - LAB//51052
    - LAB//51067
    - LAB//51069
    - LAB//51070
    - LAB//51073
    - LAB//51080
    - LAB//51081
    - LAB//51082
    - LAB//51099
    - LAB//51104
    - LAB//51106
    - LAB//51770
    - LAB//51787
    - LAB//51804
    - LAB//51825
    - LAB//51922
    - LAB//51937
    - LAB//51951
    - LAB//51963
    - LAB//51977
    - LAB//52000
    - LAB//52024
    - LAB//52026
    - LAB//52546
    - LAB//52647
    - LAB//52703
    - LAB//53161
    - LAB//53180
    - ^DIAGNOSIS//ICD//(585|N18)
  op: ==
  question: Your prediction is the probability that the patient meets the KDIGO laboratory criterion for chronic kidney
    disease (derived from longitudinal creatinine/eGFR — the label is lab-derived, not the coded diagnosis). Higher values
    MUST mean more likely positive/higher class — do not invert.
  to: any
  value: CKD//LABEL
  x: 1
derived:coagulation-hemorrhagic:
  exists: ^DIAGNOSIS//ICD//(D65|D66|D67|D68|D69|286|287)
  from: any
  guard:
    codes:
    - ^DIAGNOSIS//ICD//(286|287|D65|D66|D67|D68|D69)
  question: Your prediction is the probability that the patient's record carries a coded diagnosis of coagulation hemorrhagic
    (any ICD-9/10 code starting with D65 / D66 / D67 / D68 / D69 / 286 / 287). Higher values MUST mean more likely positive/higher
    class — do not invert.
  to: any
derived:cxr-before-anchor:
  exists: CXR//STUDY
  from: any
  to: anchor
derived:heart-failure:
  exists: ^DIAGNOSIS//ICD//(I50|428)
  from: any
  guard:
    codes:
    - ^DIAGNOSIS//ICD//(428|I50)
  question: Your prediction is the probability that the patient's record carries a coded diagnosis of heart failure (any
    ICD-9/10 code starting with I50 / 428). Higher values MUST mean more likely positive/higher class — do not invert.
  to: any
derived:septicemia:
  exists: ^DIAGNOSIS//ICD//(A40|A41|038)
  from: any
  guard:
    codes:
    - ^DIAGNOSIS//ICD//(038|A40|A41)
  question: Your prediction is the probability that the patient's record carries a coded diagnosis of septicemia (any ICD-9/10
    code starting with A40 / A41 / 038). Higher values MUST mean more likely positive/higher class — do not invert.
  to: any
outcome:ed-revisit-30d:
  exists: ED//STAY
  from: visit:MIMIC//DISCHARGE
  guard:
    fields:
    - deathtime
    - discharge_location
    - dischtime
    - edouttime
    - hospital_expire_flag
    - los
  include_from: false
  question: Your prediction is the probability that the patient re-visits the emergency department within 30 days of the
    index discharge. Higher values MUST mean more likely positive/higher class — do not invert.
  to: visit:MIMIC//DISCHARGE + 30 days
outcome:icu-admission:
  exists: MIMIC//ICU_ADMISSION
  from: any
  guard:
    fields:
    - deathtime
    - discharge_location
    - dischtime
    - edouttime
    - hospital_expire_flag
    - los
  question: Your prediction is the probability that the index admission will include an ICU stay; the patient is not in
    intensive care at the moment of admission, when the prediction is made. Higher values MUST mean more likely positive/higher
    class — do not invert.
  same_visit: true
  to: any
outcome:in-hospital-death:
  exists: MIMIC//DEATH
  from: any
  guard:
    fields:
    - deathtime
    - discharge_location
    - dischtime
    - edouttime
    - hospital_expire_flag
    - los
  question: Your prediction is the probability that the patient, alive and in hospital 24 hours after admission, dies before
    discharge from the index admission. Higher values MUST mean more likely positive/higher class — do not invert.
  same_visit: true
  to: any
outcome:los-gt7:
  from: anchor.event
  guard:
    fields:
    - deathtime
    - discharge_location
    - dischtime
    - edouttime
    - hospital_expire_flag
    - los
  include_to: false
  none: MIMIC//DISCHARGE
  question: Your prediction is the probability that the index admission lasts longer than 7 days. Higher values MUST mean
    more likely positive/higher class — do not invert.
  same_visit: true
  to: anchor.event + 8 days
outcome:readmit-30d:
  exists: MIMIC//ADMISSION
  from: visit:MIMIC//DISCHARGE
  guard:
    fields:
    - deathtime
    - discharge_location
    - dischtime
    - edouttime
    - hospital_expire_flag
    - los
  include_to: false
  other_visit: true
  question: Your prediction is the probability that the patient is readmitted to hospital within 30 days of the index discharge.
    Higher values MUST mean more likely positive/higher class — do not invert.
  to: visit:MIMIC//DISCHARGE + 31 days
