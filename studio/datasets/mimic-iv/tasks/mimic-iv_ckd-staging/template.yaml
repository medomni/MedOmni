# Converted from v0.2.1's task specs by `python -m medomni.core.contracts.convert templates` (R-68).
template_id: mimic-iv_ckd-staging
dataset: mimic-iv
authors:
- {name: Bosong Huang}
targets:
- {name: lab_ckd, label: 'mimic-iv:derived:ckd-kdigo', metric: auc}
input:
  demographics: [age, sex]
  labs: {'51222': hemoglobin, '50882': bicarbonate, '50971': potassium, '50970': phosphate, '50893': calcium_total, '50862': albumin_serum,
    '50983': sodium, '50931': glucose}
  max_results_per_lab: 30
evidence: [default, full]
exclude:
  lab_itemids: ['50912', '52546', '51006']
  derived: [eGFR]
  icd_prefixes: [N18, '585']
full:
  exclude:
    lab_itemids: ['50912', '52546', '51006', '50920', '51770', '50841', '51021', '51032', '51052', '51067', '51070', '51073',
      '51080', '51081', '51082', '51099', '51106']
    derived: [eGFR]
    icd_prefixes: [N18, '585']
agent:
  statement: Predict whether this patient has chronic kidney disease. Kidney function tests (creatinine, urea nitrogen, eGFR,
    urine albumin) have been removed from the record.
  instruction: '# mimic_ckd-staging


    Predict, for each patient, the probability that they have **chronic kidney disease** by the KDIGO criterion (two eGFR
    < 60 at least 90 days apart), **without access to any direct renal marker**: creatinine, BUN, eGFR and all kidney diagnosis
    codes are deliberately absent from your data.


    ## Data (under `/workspace/data/`)


    - `patients.jsonl` — one line per patient (subject_id + slice inventory)

    - `slices/<subject_id>_clinical-record-table.jsonl` — age at last data, sex

    - `slices/<subject_id>_clinical-measurement-irregular.jsonl` — most recent lab results (up to 30 per test): hemoglobin,
    bicarbonate, potassium, phosphate, calcium_total, albumin_serum, sodium, glucose


    ## Submission


    Write `/workspace/submission/predictions.csv` — CSV with header `subject_id,probability`, one row per patient in `patients.jsonl`,
    probability in [0,1]. Metric: AUC.

    '
  environment: {cpus: 4, memory_mb: 8192, allow_internet: true, agent_timeout_sec: 1200, verifier_timeout_sec: 300}
  submission_path: /workspace/submission/predictions.csv
