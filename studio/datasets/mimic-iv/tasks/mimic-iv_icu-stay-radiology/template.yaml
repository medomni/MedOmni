# Converted from v0.2.1's task specs by `python -m medomni.core.contracts.convert templates` (R-68).
template_id: mimic-iv_icu-stay-radiology
dataset: mimic-iv
authors:
- {name: Ming Shen Lu}
targets:
- {name: icu_admission, label: 'mimic-iv:outcome:icu-admission', metric: auc}
- {name: in_hospital_death, label: 'mimic-iv:outcome:in-hospital-death', metric: auc, question: Your prediction is the probability
    that the patient dies before discharge from the index admission. Higher values MUST mean more likely positive/higher class
    — do not invert.}
input:
  files: {cxr-radiograph-2d: cxr/files/}
  demographics: [age, sex]
agent:
  statement: At the moment this patient is admitted to hospital, predict whether the stay will include intensive care and
    whether they will survive it.
  instruction: '## Prediction time


    - Index admission: the patient''s first hospital admission on record.

    - The prediction is made at the moment of that admission. The evidence is everything recorded before it: earlier hospital
    history and the emergency department visit that led to this admission.

    - No patient here is in intensive care at that moment.'
  environment: {cpus: 4, memory_mb: 8192, allow_internet: true, agent_timeout_sec: 1200, verifier_timeout_sec: 300}
  submission_path: /workspace/submission/predictions.csv
