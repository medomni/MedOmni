# Converted from v0.2.1's task specs by `python -m medomni.core.contracts.convert templates` (R-68).
template_id: mimic-iv_sepsis-hospital
dataset: mimic-iv
authors:
- {name: Bomin Ko}
targets:
- {name: septicemia, label: 'mimic-iv:derived:septicemia', metric: auc}
input:
  labs: {'51265': platelet_count, '51301': white_blood_cells, '50912': creatinine, '52546': creatinine, '50931': glucose,
    '52569': glucose, '50882': bicarbonate, '51256': neutrophils}
  demographics: [age, sex]
  vitals: {source: ed/ed/vitalsign.csv.gz, max_rows: 40}
evidence: [default, full]
exclude:
  streams: [diagnoses, notes, 'medications (deferred, would need own leakage review)', microbiology cultures (staging engine
      deferred to v0.2)]
agent:
  statement: Predict whether this patient's hospital admission will be given a diagnosis of septicemia.
  instruction: '# mimic_sepsis-hospital


    Predict, for each patient, the probability that their **index hospital admission** (the first admission on record) receives
    a discharge diagnosis of **septicemia**. You see only data charted in the first 24 hours of that admission (plus the ED
    encounter that led to it): demographics, ED triage and vital signs, and the proposed laboratory panel (platelets, white
    cells, creatinine, glucose, bicarbonate, neutrophils). No diagnoses, notes, medications, or microbiology cultures are
    provided.


    ## Data (under `/workspace/data/`)


    - `patients.jsonl` — one line per patient (subject_id, 24h window, slice inventory)

    - `slices/<id>_clinical-record-table.jsonl` — age, sex, race

    - `slices/<id>_clinical-record-table.triage.jsonl` — ED triage record(s), when present

    - `slices/<id>_clinical-measurement-irregular.jsonl` — labs + ED vital signs inside the window, timestamped


    ## Submission


    Write `/workspace/submission/predictions.csv` — CSV `subject_id,probability`, one row per patient, probability in [0,1].
    Metric: AUC.

    '
  environment: {cpus: 4, memory_mb: 8192, allow_internet: true, agent_timeout_sec: 1200, verifier_timeout_sec: 300}
  submission_path: /workspace/submission/predictions.csv
