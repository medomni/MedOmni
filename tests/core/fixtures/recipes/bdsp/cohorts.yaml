bdsp_snoring-metrics@ladder:
  cohort:
    anchor:
      event: RECORDING//END
    select:
      by:
      - osa_severity_ahi
      n: 20
      seed: 20260925|ladder-mid|bdsp_snoring-metrics
    require:
    - has_label: osa_severity_ahi
    - files:
      - snore-acoustic
      - body-position-code-10hz
      - resp-flow
      - resp-effort-rip-2ch-50hz
      - spo2-series-10hz-pct
      - pulse-rate-10hz-bpm
      - eeg-sleep-6ch-200hz-uv
      - eog-2ch-200hz-uv
      - emg-chin-200hz-uv
      - emg-limb-200hz-uv
      - ecg-1lead-200hz-uv
      - psg-cardiorespiratory-4ch-200hz-mixed
      - ppg-waveform-uncal
      to: anchor
    source: all
  targets:
    frequent_limb_movements: bdsp:psgmetric:limb-high
    high_arousal_index: bdsp:psgmetric:arousal-high
    low_sleep_efficiency: bdsp:psgmetric:eff-low
    osa_severity_ahi: bdsp:psgclass:ahi-severity
    reduced_n3: bdsp:psgmetric:n3-low
