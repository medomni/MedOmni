# Ported from the v0.3.0 Stage 1 prototype recipes. Do not edit.
bdsp_arousal@n20:
  cohort:
    anchor:
      event: RECORDING//END
    select:
      by:
      - high_arousal_index_15h
      n: 20
      seed: 7
    require:
    - converts:
        min_families: 3
      when: select
    source: all
  targets:
    high_arousal_index_15h: bdsp:psgmetric:arousal-high
